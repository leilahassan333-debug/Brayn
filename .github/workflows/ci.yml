name: Validate MVP
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - name: Build presentation studio with mock connection settings
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://testproject.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: public-test-key
      - name: Test presentation workflow with mocked providers
        run: npx playwright test tests/e2e/presentations.spec.ts
        env:
          CI: true
          TEST_PRESENTATIONS: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
